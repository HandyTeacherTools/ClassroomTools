<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f1923" />
  <title>Classroom Sound Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0a1118;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
    }

    #app {
      width: min(680px, 100vw);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #0f1923;
      position: relative;
      overflow: hidden;
    }

    #bg-overlay {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(99,220,160,0.15) 0%, transparent 70%);
      transition: background 0.6s ease;
      pointer-events: none;
      z-index: 0;
    }

    #alert-flash {
      position: absolute; inset: 0;
      pointer-events: none;
      opacity: 0;
      background: rgba(255, 107, 91, 0.22);
      z-index: 10;
      transition: opacity 0.1s;
    }

    .content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 28px 36px;
      gap: 20px;
      flex: 1;
    }

    header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .app-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
    }

    .icon-mic {
      width: 28px; height: 28px;
      opacity: 0.25;
    }

    #level-label {
      font-size: clamp(26px, 6vw, 36px);
      font-weight: 900;
      letter-spacing: 0.04em;
      color: #63dca0;
      text-transform: uppercase;
      transition: color 0.4s ease;
      text-align: center;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-wrap {
      width: 100%;
      flex: 1;
      min-height: 220px;
      max-height: 340px;
      position: relative;
    }

    #vis-canvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }

    #meter-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #meter-track {
      width: 100%;
      height: 20px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
    }

    #meter-fill {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: linear-gradient(90deg, #63dca0 0%, #f7e040 55%, #ff9f45 78%, #ff6b5b 100%);
      transition: width 0.08s ease-out;
    }

    .meter-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      padding: 0 2px;
    }

    #controls {
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }

    #start-btn {
      background: #63dca0;
      color: #0f1923;
      border: none;
      border-radius: 40px;
      font-family: 'Nunito', sans-serif;
      font-size: 16px;
      font-weight: 800;
      padding: 12px 32px;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 0 0 0 rgba(99,220,160,0);
      white-space: nowrap;
    }
    #start-btn:hover {
      background: #7feab6;
      transform: scale(1.04);
      box-shadow: 0 0 22px rgba(99,220,160,0.35);
    }
    #start-btn:active { transform: scale(0.97); }
    #start-btn.active {
      background: #ff6b5b;
      color: #fff;
      box-shadow: 0 0 22px rgba(255,107,91,0.35);
    }
    #start-btn.active:hover { background: #ff877a; }

    .ctrl-group {
      flex: 1;
      min-width: 110px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ctrl-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.35);
    }

    input[type=range] {
      width: 100%;
      height: 4px;
      border-radius: 2px;
      accent-color: #63dca0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(255,255,255,0.1);
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #63dca0;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(99,220,160,0.5);
    }
    input[type=range].loud::-webkit-slider-thumb {
      background: #ff6b5b;
      box-shadow: 0 0 8px rgba(255,107,91,0.5);
    }

    select {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      color: #fff;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      outline: none;
      width: 100%;
    }
    select option { background: #1a2a38; }

    #status-msg {
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-height: 20px;
      letter-spacing: 0.02em;
    }

    #tip {
      font-size: 11px;
      color: rgba(255,255,255,0.18);
      font-weight: 600;
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* Pulsing mic dot when active */
    .mic-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #63dca0;
      margin-right: 8px;
      animation: pulse-dot 1.2s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.7); }
    }
    .mic-dot.loud { background: #ff6b5b; }
  </style>
</head>
<body>
<div id="app">
  <div id="bg-overlay"></div>
  <div id="alert-flash"></div>
  <div class="content">
    <header>
      <span class="app-title">Sound Monitor</span>
      <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="11" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="8" y1="22" x2="16" y2="22"/>
      </svg>
    </header>

    <div id="level-label">Ready</div>

    <div id="canvas-wrap">
      <canvas id="vis-canvas"></canvas>
    </div>

    <div id="meter-section">
      <div id="meter-track"><div id="meter-fill"></div></div>
      <div class="meter-labels">
        <span>Quiet</span><span>Okay</span><span>Loud</span><span>Too noisy!</span>
      </div>
    </div>

    <div id="controls">
      <button id="start-btn">🎤 Start</button>
      <div class="ctrl-group">
        <span class="ctrl-label">Sensitivity</span>
        <input type="range" id="sensitivity" min="0.5" max="5" step="0.1" value="2.5" />
      </div>
      <div class="ctrl-group">
        <span class="ctrl-label">Visualization</span>
        <select id="theme-select">
          <option value="bubbles">Bubbles</option>
          <option value="bars">Bars</option>
          <option value="wave">Wave</option>
          <option value="stars">Stars</option>
        </select>
      </div>
    </div>

    <div id="status-msg">Press Start and allow microphone access</div>
    <div id="tip">Best displayed fullscreen on a classroom projector or TV</div>
  </div>
</div>

<script>
(function () {
  const bgOverlay   = document.getElementById('bg-overlay');
  const alertFlash  = document.getElementById('alert-flash');
  const levelLabel  = document.getElementById('level-label');
  const canvas      = document.getElementById('vis-canvas');
  const ctx         = canvas.getContext('2d');
  const meterFill   = document.getElementById('meter-fill');
  const startBtn    = document.getElementById('start-btn');
  const senSlider   = document.getElementById('sensitivity');
  const themeSelect = document.getElementById('theme-select');
  const statusMsg   = document.getElementById('status-msg');

  let audioCtx, analyser, dataArray, source, stream;
  let running = false;
  let animFrame;
  let smoothedLevel = 0;
  let alertCooldown = 0;

  const bubbles  = [];
  const stars    = [];
  let barHeights = [];

  /* ── Canvas resize ─────────────────────────────────────────── */
  function resizeCanvas() {
    const wrap = canvas.parentElement.getBoundingClientRect();
    canvas.width  = wrap.width  || 620;
    canvas.height = wrap.height || 260;
    initBubbles();
    initStars();
    barHeights = new Array(40).fill(0);
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  /* ── Bubble helpers ─────────────────────────────────────────── */
  function randBubble(randomY) {
    const W = canvas.width, H = canvas.height;
    return {
      x: Math.random() * W,
      y: randomY ? Math.random() * H : H + 35,
      r: 9 + Math.random() * 30,
      vx: (Math.random() - 0.5) * 1.2,
      vy: -(0.3 + Math.random() * 1.4),
      phase: Math.random() * Math.PI * 2
    };
  }
  function initBubbles() { bubbles.length = 0; for (let i = 0; i < 32; i++) bubbles.push(randBubble(true)); }
  function initStars() {
    stars.length = 0;
    const W = canvas.width, H = canvas.height;
    for (let i = 0; i < 65; i++) stars.push({ x: Math.random()*W, y: Math.random()*H, base: 2 + Math.random()*5, r: 2, phase: Math.random()*Math.PI*2, speed: 0.02 + Math.random()*0.05 });
  }

  /* ── Level → UI helpers ─────────────────────────────────────── */
  function hueFor(lv) { return lv < 0.18 ? 155 : lv < 0.42 ? 52 : lv < 0.65 ? 35 : 10; }
  function infoFor(lv) {
    if (lv < 0.18) return { label:'🤫 Quiet',           color:'#63dca0', accent:'rgba(99,220,160,0.15)' };
    if (lv < 0.42) return { label:'📢 Getting louder…', color:'#f7e040', accent:'rgba(247,224,64,0.15)' };
    if (lv < 0.65) return { label:'🔊 Too loud!',        color:'#ffa040', accent:'rgba(255,160,64,0.18)' };
    return              { label:'🚨 Way too noisy!',   color:'#ff6b5b', accent:'rgba(255,107,91,0.28)' };
  }

  /* ── Draw modes ─────────────────────────────────────────────── */
  function drawBubbles(lv, t) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const speed = 0.5 + lv * 4.5;
    const scale = 1 + lv * 1.8;
    const hue   = hueFor(lv);
    for (let b of bubbles) {
      b.x += b.vx * speed + Math.sin(t*0.001 + b.phase) * 0.4;
      b.y += b.vy * speed;
      if (b.y < -b.r*2) { Object.assign(b, randBubble(false)); b.y = H + b.r; }
      if (b.x < -b.r)  b.x = W + b.r;
      if (b.x > W+b.r) b.x = -b.r;
      const r = b.r * scale;
      const a = Math.min(0.88, 0.3 + lv*0.55);
      ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue},80%,62%,${a*0.45})`; ctx.fill();
      ctx.strokeStyle = `hsla(${hue},88%,74%,${a})`; ctx.lineWidth = 2; ctx.stroke();
      ctx.beginPath(); ctx.arc(b.x - r*0.25, b.y - r*0.3, r*0.18, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${a*0.55})`; ctx.fill();
    }
  }

  function drawBars(lv, t) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const count = 40, gap = 3;
    const bw = (W - gap*(count-1)) / count;
    const hue = hueFor(lv);
    for (let i = 0; i < count; i++) {
      const mod = 0.4 + 0.6 * Math.sin(i*0.45 + t*0.002);
      const target = lv * mod * H * 0.9;
      barHeights[i] = barHeights[i]*0.76 + target*0.24;
      const h = barHeights[i];
      ctx.fillStyle = `hsla(${hue},82%,60%,${0.5+lv*0.5})`;
      const bx = i*(bw+gap);
      ctx.beginPath(); ctx.roundRect(bx, H-h, bw, h, 4); ctx.fill();
    }
  }

  function drawWave(lv, t) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const amp  = lv * H * 0.44;
    const freq = 2 + lv * 4;
    const hue  = hueFor(lv);
    for (let layer = 3; layer >= 0; layer--) {
      const la = amp * (0.4 + layer*0.2);
      const off = layer * Math.PI * 0.5;
      const alpha = 0.13 + layer*0.11;
      [[1,1],[1,-1]].forEach(([sy,side]) => {
        ctx.beginPath(); ctx.moveTo(0, H/2);
        for (let x=0; x<=W; x+=2) {
          const y = H/2 + sy*(Math.sin(x/W*Math.PI*2*freq + t*0.002 + off)*la + Math.sin(x/W*Math.PI*2*(freq*0.7)+t*0.003-off)*la*0.4);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(W, side===1?H:0); ctx.lineTo(0, side===1?H:0); ctx.closePath();
        ctx.fillStyle = `hsla(${hue},82%,60%,${alpha})`; ctx.fill();
      });
    }
  }

  function drawStars(lv, t) {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const hue = hueFor(lv);
    for (let s of stars) {
      s.phase += s.speed*(1+lv*5);
      s.r = s.base*(1 + lv*3*(0.5+0.5*Math.sin(s.phase)));
      const a = 0.25 + lv*0.75;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `hsla(${hue},88%,74%,${a})`; ctx.fill();
      if (lv > 0.35) {
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r*2.8, 0, Math.PI*2);
        ctx.fillStyle = `hsla(${hue},88%,74%,${a*0.14})`; ctx.fill();
      }
    }
  }

  /* ── Audio loop ─────────────────────────────────────────────── */
  function loop(t) {
    if (!running) return;
    animFrame = requestAnimationFrame(loop);
    analyser.getByteFrequencyData(dataArray);
    let sum = 0; for (let v of dataArray) sum += v;
    const raw = sum / dataArray.length / 255;
    const sens = parseFloat(senSlider.value) / 2.5;
    const target = Math.min(1, raw * sens * 3.5);
    smoothedLevel = smoothedLevel*0.82 + target*0.18;

    const info = infoFor(smoothedLevel);
    levelLabel.textContent = info.label;
    levelLabel.style.color = info.color;
    meterFill.style.width  = (smoothedLevel*100).toFixed(1) + '%';
    bgOverlay.style.background = `radial-gradient(ellipse at 50% 0%, ${info.accent} 0%, transparent 70%)`;

    if (smoothedLevel > 0.65 && alertCooldown <= 0) {
      alertFlash.style.opacity = '1';
      setTimeout(() => alertFlash.style.opacity = '0', 180);
      alertCooldown = 28;
    }
    if (alertCooldown > 0) alertCooldown--;

    const mode = themeSelect.value;
    if (mode === 'bubbles') drawBubbles(smoothedLevel, t);
    else if (mode === 'bars') drawBars(smoothedLevel, t);
    else if (mode === 'wave') drawWave(smoothedLevel, t);
    else drawStars(smoothedLevel, t);
  }

  /* ── Start / stop ───────────────────────────────────────────── */
  async function start() {
    if (running) { stopMonitor(); return; }
    try {
      stream   = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      running = true;
      startBtn.innerHTML = '⏹ Stop';
      startBtn.classList.add('active');
      statusMsg.innerHTML = '<span class="mic-dot"></span> Listening…';
      requestAnimationFrame(loop);
    } catch(e) {
      statusMsg.textContent = '⚠️ Microphone access denied — please allow it in your browser settings.';
    }
  }

  function stopMonitor() {
    running = false;
    if (animFrame) cancelAnimationFrame(animFrame);
    if (source) source.disconnect();
    if (audioCtx) audioCtx.close();
    if (stream)  stream.getTracks().forEach(t => t.stop());
    startBtn.innerHTML = '🎤 Start';
    startBtn.classList.remove('active');
    statusMsg.textContent = 'Press Start and allow microphone access';
    levelLabel.textContent = 'Ready';
    levelLabel.style.color = '#63dca0';
    meterFill.style.width = '0%';
    smoothedLevel = 0;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bgOverlay.style.background = 'radial-gradient(ellipse at 50% 0%, rgba(99,220,160,0.15) 0%, transparent 70%)';
  }

  startBtn.addEventListener('click', start);

  /* ── Fullscreen on double-click ─────────────────────────────── */
  document.getElementById('app').addEventListener('dblclick', () => {
    const el = document.getElementById('app');
    if (!document.fullscreenElement) {
      el.requestFullscreen && el.requestFullscreen();
    } else {
      document.exitFullscreen && document.exitFullscreen();
    }
  });

})();
</script>
</body>
</html>
