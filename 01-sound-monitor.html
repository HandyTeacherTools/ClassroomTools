<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Sound Monitor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Inter',sans-serif;
    background:#0b1220;
    color:white;
    display:flex;
    justify-content:center;
}

#app {
    width:100%;
    max-width:900px;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

/* TOP BAR */
.top {
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.btn {
    background:#1f2a44;
    border:none;
    color:white;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

/* TITLE */
h1 {
    margin:10px 0 0;
    font-size:28px;
}

#instruction {
    font-size:16px;
    opacity:.8;
    margin-bottom:10px;
}

/* LIGHT */
#light {
    width:220px;
    height:220px;
    border-radius:50%;
    margin:20px 0;
    background:lime;
    box-shadow:0 0 60px lime;
    transition:.2s;
}

/* STATUS */
#status {
    font-size:28px;
    font-weight:700;
}

/* METER */
#meter {
    width:100%;
    height:20px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
}
#fill {
    height:100%;
    width:0%;
    background:lime;
}

/* STAR PROGRESS */
#progressBar {
    width:100%;
    height:14px;
    background:#333;
    border-radius:7px;
    margin-top:10px;
}
#progressFill {
    height:100%;
    width:0%;
    background:gold;
}

/* SCORE */
#score {
    margin-top:10px;
    font-size:22px;
}

/* CONTROLS */
.controls {
    margin-top:20px;
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label {
    font-size:12px;
    opacity:.7;
}
input {
    width:100%;
}
</style>

</head>

<body>

<div id="app">

<div class="top">
    <a href="index.html" class="btn">← Back</a>
    <button class="btn" onclick="toggleFull()">Fullscreen</button>
</div>

<h1>Sound Level Game</h1>
<div id="instruction">Stay quiet to earn stars ⭐</div>

<div id="light"></div>
<div id="status">Press Start</div>

<div id="meter"><div id="fill"></div></div>

<div id="progressBar"><div id="progressFill"></div></div>
<div id="score">⭐ 0 / 5</div>

<div class="controls">
    <div>
        <label>Sensitivity</label>
        <input type="range" id="sens" min="1" max="5" step="0.1" value="2.5">
    </div>

```
<div>
    <label>Noise Limit</label>
    <input type="range" id="threshold" min="0.2" max="0.8" step="0.01" value="0.5">
</div>

<button class="btn" onclick="start()">Start</button>
<button class="btn" onclick="stop()">Stop</button>
<button class="btn" onclick="resetGame()">Reset</button>
```

</div>

</div>

<script>
let ctx, analyser, data, running=false;
let level=0;

let stars=0;
const goal=5;
let progress=0;
const requiredFrames=120; // time to earn a star

async function start(){
    if(running) return;

    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    ctx = new AudioContext();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    data = new Uint8Array(analyser.frequencyBinCount);

    const src = ctx.createMediaStreamSource(stream);
    src.connect(analyser);

    running=true;
    loop();
}

function stop(){
    running=false;
    document.getElementById("status").innerText="Stopped";
}

function resetGame(){
    stars=0;
    progress=0;
    updateUI();
}

function loop(){
    if(!running) return;
    requestAnimationFrame(loop);

    analyser.getByteFrequencyData(data);
    let sum=0;
    for(let v of data) sum+=v;
    let raw=sum/data.length/255;

    const sens=document.getElementById("sens").value;
    const threshold=document.getElementById("threshold").value;

    level=level*0.8 + raw*sens*0.2;

    document.getElementById("fill").style.width=(level*100)+"%";

    const light=document.getElementById("light");
    const status=document.getElementById("status");

    if(level < threshold*0.5){
        light.style.background="lime";
        light.style.boxShadow="0 0 60px lime";
        status.innerText="Perfect! Keep it up 👍";

        progress++;

        if(progress >= requiredFrames){
            if(stars < goal){
                stars++;
                progress=0;
                updateUI();
            }
        }

    } else if(level < threshold){
        light.style.background="yellow";
        light.style.boxShadow="0 0 60px yellow";
        status.innerText="Getting louder…";
        progress=0;

    } else {
        light.style.background="red";
        light.style.boxShadow="0 0 60px red";
        status.innerText="Too loud!";
        progress=0;
    }

    updateProgress();
    checkWin();
}

function updateProgress(){
    const percent = (progress / requiredFrames) * 100;
    document.getElementById("progressFill").style.width = percent + "%";
}

function updateUI(){
    document.getElementById("score").innerText = "⭐ " + stars + " / " + goal;
}

function checkWin(){
    if(stars === goal){
        document.getElementById("status").innerText="🎉 You win! Great job!";
        running=false;
        setTimeout(resetGame, 3000);
    }
}

function toggleFull(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
