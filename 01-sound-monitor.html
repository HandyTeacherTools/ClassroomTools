<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Sound Monitor</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
    margin:0;
    font-family:'Inter',sans-serif;
    background:#0b1220;
    color:white;
    display:flex;
    justify-content:center;
}

/* APP */
#app {
    width:100%;
    max-width:900px;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

/* TOP BAR */
.top {
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.btn {
    background:#1f2a44;
    border:none;
    color:white;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
}

/* STATUS */
#status {
    font-size:40px;
    font-weight:800;
    margin:10px 0;
}

/* LIGHT */
#light {
    width:220px;
    height:220px;
    border-radius:50%;
    background:green;
    box-shadow:0 0 60px rgba(0,255,100,0.5);
    margin:20px 0;
    transition:all .2s ease;
}

/* METER */
#meter {
    width:100%;
    height:20px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
}
#fill {
    height:100%;
    width:0%;
    background:lime;
}

/* CONTROLS */
.controls {
    width:100%;
    margin-top:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label {
    font-size:12px;
    opacity:.7;
}

input {
    width:100%;
}

/* REWARD */
#reward {
    margin-top:20px;
    font-size:22px;
}

.star {
    color:gold;
    font-size:26px;
}

/* BIG MODE */
.fullscreen #app {
    max-width:none;
}
</style>

</head>

<body>

<div id="app">

<div class="top">
    <a href="index.html" class="btn">← Tools</a>
    <button class="btn" onclick="toggleFull()">Fullscreen</button>
</div>

<div id="status">Ready</div>
<div id="light"></div>

<div id="meter"><div id="fill"></div></div>

<div id="reward">⭐ 0 / 5</div>

<div class="controls">
    <div>
        <label>Sensitivity</label>
        <input type="range" id="sens" min="1" max="5" step="0.1" value="2.5">
    </div>

```
<div>
    <label>Noise Threshold</label>
    <input type="range" id="threshold" min="0.2" max="0.8" step="0.01" value="0.5">
</div>

<button class="btn" onclick="start()">Start</button>
<button class="btn" onclick="resetStars()">Reset Stars</button>
```

</div>

</div>

<script>
let ctx, analyser, data, running=false;
let level=0;
let stars=0;
let quietTime=0;

async function start(){
    if(running){location.reload(); return;}
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    ctx = new AudioContext();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    data = new Uint8Array(analyser.frequencyBinCount);
    const src = ctx.createMediaStreamSource(stream);
    src.connect(analyser);
    running=true;
    loop();
}

function loop(){
    requestAnimationFrame(loop);
    analyser.getByteFrequencyData(data);

    let sum=0;
    for(let v of data) sum+=v;
    let raw = sum/data.length/255;

    const sens = document.getElementById("sens").value;
    const threshold = document.getElementById("threshold").value;

    level = level*0.8 + raw*sens*0.2;

    document.getElementById("fill").style.width = (level*100)+"%";

    const light = document.getElementById("light");
    const status = document.getElementById("status");

    if(level < threshold*0.5){
        light.style.background="lime";
        light.style.boxShadow="0 0 60px lime";
        status.innerText="Perfect 👍";

        quietTime++;
        if(quietTime > 120){
            stars++;
            quietTime=0;
            updateStars();
        }

    } else if(level < threshold){
        light.style.background="yellow";
        light.style.boxShadow="0 0 60px yellow";
        status.innerText="Getting Loud…";
        quietTime=0;

    } else {
        light.style.background="red";
        light.style.boxShadow="0 0 60px red";
        status.innerText="Too Loud!";
        quietTime=0;
    }
}

function updateStars(){
    document.getElementById("reward").innerHTML =
        "⭐ " + stars + " / 5";
}

function resetStars(){
    stars=0;
    updateStars();
}

function toggleFull(){
    if(!document.fullscreenElement){
        document.documentElement.requestFullscreen();
    } else {
        document.exitFullscreen();
    }
}
</script>

</body>
</html>
