<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classroom Timer</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --panel: #0f3460;
    --green: #4ecca3;
    --yellow: #ffcc02;
    --red: #e94560;
    --text: #eaeaea;
    --muted: #7a7a9a;
    --active: var(--green);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 32px;
    padding: 20px;
  }

  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image: linear-gradient(rgba(78,204,163,0.04) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(78,204,163,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  .title {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--muted);
    position: relative; z-index: 1;
  }

  .clock-face {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
  }

  .ring-container {
    position: relative; width: clamp(240px, 40vw, 380px); height: clamp(240px, 40vw, 380px);
  }
  svg.ring { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--surface); stroke-width: 12; }
  .ring-progress {
    fill: none; stroke: var(--active); stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.5s linear, stroke 0.5s;
    filter: drop-shadow(0 0 8px var(--active));
  }

  .time-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 4px;
  }
  .time-display {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(3.5rem, 10vw, 7rem);
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--text);
    line-height: 1;
    transition: color 0.5s;
  }
  .time-display.warning { color: var(--yellow); }
  .time-display.danger { color: var(--red); animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

  .mode-label {
    font-size: 0.8rem; letter-spacing: 4px; color: var(--muted); text-transform: uppercase;
  }

  .controls {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
    position: relative; z-index: 1;
  }

  .btn {
    font-family: 'Oswald', sans-serif;
    font-size: 1.2rem; letter-spacing: 2px;
    padding: 14px 32px;
    border: 2px solid var(--active);
    background: transparent; color: var(--active);
    border-radius: 4px; cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .btn:hover { background: var(--active); color: var(--bg); }
  .btn.primary { background: var(--active); color: var(--bg); }
  .btn.primary:hover { background: transparent; color: var(--active); }
  .btn.danger { border-color: var(--red); color: var(--red); }
  .btn.danger:hover { background: var(--red); color: var(--bg); }

  .presets {
    display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
    position: relative; z-index: 1;
  }
  .preset-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.95rem; letter-spacing: 2px;
    padding: 8px 18px;
    border: 1px solid var(--muted);
    background: transparent; color: var(--muted);
    border-radius: 4px; cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }
  .preset-btn:hover { border-color: var(--active); color: var(--active); }

  .custom-row {
    display: flex; align-items: center; gap: 12px;
    position: relative; z-index: 1;
  }
  .custom-row input {
    width: 70px; padding: 10px;
    background: var(--surface); border: 1px solid var(--muted);
    color: var(--text); font-family: 'Oswald', sans-serif;
    font-size: 1.2rem; text-align: center;
    border-radius: 4px; outline: none;
  }
  .custom-row input:focus { border-color: var(--active); }
  .custom-row label { color: var(--muted); font-size: 0.9rem; letter-spacing: 2px; text-transform: uppercase; }

  .mode-switch {
    display: flex; gap: 0;
    border: 1px solid var(--muted); border-radius: 4px; overflow: hidden;
    position: relative; z-index: 1;
  }
  .mode-btn {
    font-family: 'Oswald', sans-serif;
    font-size: 0.9rem; letter-spacing: 2px;
    padding: 8px 20px;
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; transition: all 0.2s;
    text-transform: uppercase;
  }
  .mode-btn.active { background: var(--active); color: var(--bg); }

  .done-overlay {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px;
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  .done-overlay.show { opacity: 1; pointer-events: all; }
  .done-text {
    font-family: 'Oswald', sans-serif;
    font-size: clamp(4rem, 12vw, 9rem);
    font-weight: 700;
    color: var(--green);
    filter: drop-shadow(0 0 40px var(--green));
    animation: doneAnim 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes doneAnim { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .done-sub { font-size: 1.5rem; color: var(--muted); letter-spacing: 4px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="bg-grid"></div>

<div class="title">Classroom Timer</div>

<div class="mode-switch">
  <button class="mode-btn active" onclick="setMode('countdown')">Countdown</button>
  <button class="mode-btn" onclick="setMode('stopwatch')">Stopwatch</button>
</div>

<div class="clock-face">
  <div class="ring-container">
    <svg class="ring" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="88"/>
      <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="88"
        stroke-dasharray="553" stroke-dashoffset="0"/>
    </svg>
    <div class="time-center">
      <div class="time-display" id="timeDisplay">05:00</div>
      <div class="mode-label" id="modeLabel">Countdown</div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn primary" id="startBtn" onclick="toggleTimer()">Start</button>
  <button class="btn danger" onclick="resetTimer()">Reset</button>
</div>

<div class="presets">
  <button class="preset-btn" onclick="setPreset(60)">1 min</button>
  <button class="preset-btn" onclick="setPreset(180)">3 min</button>
  <button class="preset-btn" onclick="setPreset(300)">5 min</button>
  <button class="preset-btn" onclick="setPreset(600)">10 min</button>
  <button class="preset-btn" onclick="setPreset(900)">15 min</button>
  <button class="preset-btn" onclick="setPreset(1800)">30 min</button>
</div>

<div class="custom-row">
  <label>Custom:</label>
  <input type="number" id="customMin" min="0" max="99" value="5" placeholder="mm">
  <label>min</label>
  <input type="number" id="customSec" min="0" max="59" value="0" placeholder="ss">
  <label>sec</label>
  <button class="btn" onclick="applyCustom()" style="padding:10px 20px;font-size:1rem;">Set</button>
</div>

<div class="done-overlay" id="doneOverlay" onclick="dismissDone()">
  <div class="done-text">⏰ TIME!</div>
  <div class="done-sub">Tap anywhere to dismiss</div>
</div>

<script>
  const CIRCUMFERENCE = 2 * Math.PI * 88; // 553
  let mode = 'countdown';
  let totalSeconds = 300;
  let remaining = 300;
  let elapsed = 0;
  let running = false;
  let interval = null;
  let beepCtx = null;

  function getAudioCtx() {
    if (!beepCtx) beepCtx = new (window.AudioContext || window.webkitAudioContext)();
    return beepCtx;
  }

  function beep(freq = 880, dur = 0.15, vol = 0.3) {
    try {
      const ctx = getAudioCtx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
      o.start(); o.stop(ctx.currentTime + dur);
    } catch(e) {}
  }

  function playDone() {
    [880, 1100, 1320].forEach((f, i) => setTimeout(() => beep(f, 0.3, 0.4), i * 200));
  }

  function setMode(m) {
    mode = m;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('modeLabel').textContent = m === 'countdown' ? 'Countdown' : 'Stopwatch';
    resetTimer();
    document.getElementById('timeDisplay').textContent = m === 'countdown' ? formatTime(remaining) : '00:00';
    const presets = document.querySelector('.presets');
    const customRow = document.querySelector('.custom-row');
    presets.style.display = m === 'countdown' ? 'flex' : 'none';
    customRow.style.display = m === 'countdown' ? 'flex' : 'none';
    updateRing(m === 'countdown' ? 0 : 0);
  }

  function formatTime(secs) {
    const m = Math.floor(Math.abs(secs) / 60);
    const s = Math.abs(secs) % 60;
    return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function updateRing(progress) { // 0 to 1
    const offset = CIRCUMFERENCE * (1 - progress);
    document.getElementById('ringProgress').style.strokeDashoffset = offset;
  }

  function updateDisplay() {
    const display = document.getElementById('timeDisplay');
    const ring = document.getElementById('ringProgress');

    if (mode === 'countdown') {
      display.textContent = formatTime(remaining);
      const progress = remaining / totalSeconds;
      updateRing(progress);

      display.className = 'time-display';
      if (remaining <= 10) {
        display.classList.add('danger');
        ring.style.stroke = 'var(--red)';
        ring.style.filter = 'drop-shadow(0 0 8px var(--red))';
        if (remaining > 0 && remaining <= 10) beep(440, 0.05, 0.2);
      } else if (remaining <= totalSeconds * 0.25) {
        display.classList.add('warning');
        ring.style.stroke = 'var(--yellow)';
        ring.style.filter = 'drop-shadow(0 0 8px var(--yellow))';
      } else {
        ring.style.stroke = 'var(--green)';
        ring.style.filter = 'drop-shadow(0 0 8px var(--green))';
      }
    } else {
      display.textContent = formatTime(elapsed);
      updateRing((elapsed % 60) / 60);
    }
  }

  function toggleTimer() {
    if (running) {
      clearInterval(interval);
      running = false;
      document.getElementById('startBtn').textContent = 'Resume';
      document.getElementById('startBtn').classList.remove('primary');
    } else {
      running = true;
      document.getElementById('startBtn').textContent = 'Pause';
      document.getElementById('startBtn').classList.add('primary');
      interval = setInterval(() => {
        if (mode === 'countdown') {
          remaining--;
          if (remaining <= 0) {
            remaining = 0;
            updateDisplay();
            clearInterval(interval);
            running = false;
            document.getElementById('startBtn').textContent = 'Start';
            playDone();
            document.getElementById('doneOverlay').classList.add('show');
          }
        } else {
          elapsed++;
        }
        updateDisplay();
      }, 1000);
    }
  }

  function resetTimer() {
    clearInterval(interval); running = false;
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('startBtn').classList.add('primary');
    if (mode === 'countdown') { remaining = totalSeconds; }
    else { elapsed = 0; }
    updateDisplay();
    const ring = document.getElementById('ringProgress');
    ring.style.stroke = 'var(--green)';
    ring.style.filter = 'drop-shadow(0 0 8px var(--green))';
  }

  function setPreset(secs) {
    totalSeconds = secs;
    remaining = secs;
    clearInterval(interval); running = false;
    document.getElementById('startBtn').textContent = 'Start';
    document.getElementById('startBtn').classList.add('primary');
    updateDisplay();
  }

  function applyCustom() {
    const m = parseInt(document.getElementById('customMin').value) || 0;
    const s = parseInt(document.getElementById('customSec').value) || 0;
    setPreset(m * 60 + s);
  }

  function dismissDone() {
    document.getElementById('doneOverlay').classList.remove('show');
    resetTimer();
  }

  updateDisplay();
</script>
</body>
</html>
