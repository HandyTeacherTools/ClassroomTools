<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whiteboard — Handy Teacher Tools</title>
<style>
  :root {
    --bg:#0f172a; --surface:#1e293b; --border:#334155;
    --text:#f1f5f9; --muted:#94a3b8; --accent:#38bdf8;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow:hidden; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#1a1a1a; color:var(--text); display:flex; flex-direction:column; }

  .top-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 14px; background:#111; border-bottom:1px solid #333;
    font-size:.8rem; color:#999; flex-shrink:0; z-index:10;
  }
  .top-bar a { color:var(--accent); text-decoration:none; }

  /* TOOLBAR */
  .toolbar {
    display:flex; align-items:center; flex-wrap:wrap; gap:4px;
    padding:6px 10px; background:#1a1a1a; border-bottom:1px solid #333;
    flex-shrink:0; z-index:10;
  }
  .tool-group { display:flex; align-items:center; gap:3px; padding:0 6px; border-right:1px solid #333; }
  .tool-group:last-child { border-right:none; }

  .tool-btn {
    width:36px; height:36px; border-radius:7px; border:2px solid transparent;
    background:transparent; color:#ccc; font-size:1.1rem; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .12s;
    position:relative;
  }
  .tool-btn:hover { background:#2a2a2a; color:#fff; }
  .tool-btn.active { background:#38bdf8; color:#000; border-color:#38bdf8; }
  .tool-btn[title]:hover::after {
    content:attr(title);
    position:absolute; bottom:-28px; left:50%; transform:translateX(-50%);
    background:#111; color:#fff; font-size:.7rem; padding:3px 7px;
    border-radius:4px; white-space:nowrap; pointer-events:none; z-index:99;
  }

  input[type="range"] { width:70px; accent-color:#38bdf8; cursor:pointer; }
  input[type="color"] {
    width:32px; height:32px; border-radius:50%; border:2px solid #444;
    padding:1px; background:none; cursor:pointer;
  }

  .colour-swatches { display:flex; gap:4px; flex-wrap:wrap; max-width:180px; }
  .swatch {
    width:22px; height:22px; border-radius:50%; cursor:pointer;
    border:2px solid transparent; transition:all .1s; flex-shrink:0;
  }
  .swatch:hover, .swatch.active { border-color:#fff; transform:scale(1.2); }

  .bg-btns { display:flex; gap:3px; }
  .bg-btn {
    width:28px; height:28px; border-radius:5px; border:2px solid transparent;
    cursor:pointer; transition:all .12s; font-size:.85rem;
    display:flex; align-items:center; justify-content:center;
  }
  .bg-btn:hover { border-color:#888; }
  .bg-btn.active { border-color:#38bdf8; }

  /* CANVAS WRAPPER — fills all remaining space */
  .canvas-wrapper {
    flex:1; overflow:hidden; position:relative; min-height:0;
  }
  #wb-canvas {
    display:block;
    width:100%;
    height:100%;
    cursor:crosshair;
    touch-action:none;
  }
  #wb-canvas.cursor-text { cursor:text; }
  #wb-canvas.cursor-eraser { cursor:cell; }

  /* Text input overlay */
  #text-input-overlay {
    position:absolute; display:none;
    background:rgba(255,255,255,0.05);
    border:2px dashed #38bdf8;
    border-radius:4px; min-width:80px; min-height:40px;
    outline:none; color:inherit; font-family:'Segoe UI',sans-serif;
    padding:4px 8px; resize:both; overflow:auto;
    white-space:pre; z-index:20;
  }

  .footer { display:none; } /* hidden in full board mode */

  #cookie-banner { position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:999;font-size:.8rem;color:#94a3b8; }
  #cookie-banner a { color:#38bdf8; }
  #cookie-banner .cookie-btns { display:flex;gap:8px;flex-shrink:0; }
  #cookie-banner button { padding:5px 12px;border-radius:6px;border:none;cursor:pointer;font-size:.8rem;font-weight:600; }
  .btn-accept { background:#38bdf8;color:#0f172a; }
  .btn-decline { background:#334155;color:#f1f5f9; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html">← All Tools</a>
  <span>✏️ Whiteboard &mdash; handyteachertools.com</span>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <!-- Tools -->
  <div class="tool-group">
    <button class="tool-btn active" id="tool-pen"     title="Pen (P)"     onclick="setTool('pen')">✏️</button>
    <button class="tool-btn"        id="tool-marker"  title="Marker (M)"  onclick="setTool('marker')">🖊️</button>
    <button class="tool-btn"        id="tool-eraser"  title="Eraser (E)"  onclick="setTool('eraser')">🧹</button>
    <button class="tool-btn"        id="tool-line"    title="Line (L)"    onclick="setTool('line')">╱</button>
    <button class="tool-btn"        id="tool-rect"    title="Rectangle (R)" onclick="setTool('rect')">▭</button>
    <button class="tool-btn"        id="tool-circle"  title="Circle (C)"  onclick="setTool('circle')">○</button>
    <button class="tool-btn"        id="tool-arrow"   title="Arrow (A)"   onclick="setTool('arrow')">→</button>
    <button class="tool-btn"        id="tool-text"    title="Text (T)"    onclick="setTool('text')">T</button>
  </div>

  <!-- Size -->
  <div class="tool-group">
    <span style="font-size:.75rem;color:#888;">SIZE</span>
    <input type="range" id="size-slider" min="2" max="60" value="5" oninput="brushSize=+this.value">
  </div>

  <!-- Colours -->
  <div class="tool-group">
    <div class="colour-swatches" id="swatches"></div>
    <input type="color" id="colour-picker" value="#ffffff" oninput="setColour(this.value)" title="Custom colour">
  </div>

  <!-- Backgrounds -->
  <div class="tool-group">
    <div class="bg-btns">
      <div class="bg-btn active" id="bg-dark"  title="Dark"       style="background:#1a1a1a"        onclick="setBg('dark')"></div>
      <div class="bg-btn"        id="bg-white" title="White"      style="background:#fff"           onclick="setBg('white')"></div>
      <div class="bg-btn"        id="bg-green" title="Chalkboard" style="background:#2d5a27"        onclick="setBg('green')"></div>
      <div class="bg-btn"        id="bg-grid"  title="Grid"       style="background:#fff;color:#aaa;font-size:.6rem;text-align:center;line-height:28px;" onclick="setBg('grid')">▦</div>
    </div>
  </div>

  <!-- Actions -->
  <div class="tool-group">
    <button class="tool-btn" title="Undo (Ctrl+Z)"    onclick="undo()">↩️</button>
    <button class="tool-btn" title="Redo (Ctrl+Y)"    onclick="redo()">↪️</button>
    <button class="tool-btn" title="Clear board"      onclick="clearBoard()">🗑️</button>
    <button class="tool-btn" title="Save as PNG"      onclick="saveImage()">💾</button>
    <button class="tool-btn" title="Fullscreen (F11)" onclick="toggleFullscreen()">⛶</button>
  </div>
</div>

<!-- CANVAS -->
<div class="canvas-wrapper" id="canvas-wrapper">
  <canvas id="wb-canvas"></canvas>
  <textarea id="text-input-overlay" onblur="commitText()"></textarea>
</div>

<div id="cookie-banner">
  <span>🍪 We use advertising cookies (via Google AdSense) to keep this site free for teachers. Our tools collect no personal data. <a href="cookies.html">Cookie Policy</a> · <a href="privacy.html">Privacy Policy</a></span>
  <div class="cookie-btns">
    <button class="btn-accept" onclick="acceptCookies()">✅ Accept</button>
    <button class="btn-decline" onclick="declineCookies()">Decline</button>
  </div>
</div>

<script>
if(localStorage.getItem('cookieChoice')) document.getElementById('cookie-banner').style.display='none';
function acceptCookies(){ localStorage.setItem('cookieChoice','accepted'); document.getElementById('cookie-banner').style.display='none'; }
function declineCookies(){ localStorage.setItem('cookieChoice','declined'); document.getElementById('cookie-banner').style.display='none'; }

// ---- STATE ----
let tool = 'pen';
let brushSize = 5;
let colour = '#ffffff';
let bgMode = 'dark';
let drawing = false;
let startX, startY;
let undoStack = [];
let redoStack = [];
let textPos = {x:0,y:0};

const SWATCHES = ['#ffffff','#000000','#ef4444','#f97316','#eab308',
  '#22c55e','#38bdf8','#818cf8','#f472b6','#a78bfa','#34d399','#fbbf24'];

const canvas = document.getElementById('wb-canvas');
const ctx = canvas.getContext('2d');
const wrapper = document.getElementById('canvas-wrapper');
const textOverlay = document.getElementById('text-input-overlay');

// ---- CANVAS SIZING ----
function resizeCanvas(){
  const w = wrapper.clientWidth;
  const h = wrapper.clientHeight;
  // Save current drawing
  const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
  canvas.width  = w;
  canvas.height = h;
  drawBackground();
  ctx.putImageData(imgData,0,0);
}

function drawBackground(){
  const w=canvas.width, h=canvas.height;
  if(bgMode==='dark'){
    ctx.fillStyle='#1a1a1a';
  } else if(bgMode==='white'){
    ctx.fillStyle='#ffffff';
  } else if(bgMode==='green'){
    ctx.fillStyle='#2d5a27';
  } else {
    ctx.fillStyle='#ffffff';
  }
  ctx.fillRect(0,0,w,h);

  if(bgMode==='grid'){
    ctx.strokeStyle='#d0d0d0';
    ctx.lineWidth=0.5;
    const step=30;
    for(let x=0;x<w;x+=step){ ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke(); }
    for(let y=0;y<h;y+=step){ ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke(); }
  }
}

function setBg(mode){
  bgMode=mode;
  document.querySelectorAll('.bg-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('bg-'+mode).classList.add('active');
  saveUndo();
  drawBackground();
  restoreDrawing();
}

// Store drawings as image data separate from bg
let drawingLayer = null;
function saveDrawingLayer(){
  drawingLayer = ctx.getImageData(0,0,canvas.width,canvas.height);
}
function restoreDrawing(){
  if(drawingLayer) ctx.putImageData(drawingLayer,0,0);
}

// ---- COLOURS ----
function buildSwatches(){
  const container=document.getElementById('swatches');
  container.innerHTML='';
  SWATCHES.forEach(c=>{
    const div=document.createElement('div');
    div.className='swatch'+(c===colour?' active':'');
    div.style.background=c;
    div.onclick=()=>setColour(c);
    container.appendChild(div);
  });
}
function setColour(c){
  colour=c;
  document.getElementById('colour-picker').value=c.length===7?c:'#ffffff';
  document.querySelectorAll('.swatch').forEach(s=>{
    s.classList.toggle('active', s.style.background===c || rgbToHex(s.style.background)===c.toLowerCase());
  });
}
function rgbToHex(rgb){
  const m=rgb.match(/\d+/g); if(!m||m.length<3) return rgb;
  return '#'+m.slice(0,3).map(n=>parseInt(n).toString(16).padStart(2,'0')).join('');
}

// ---- TOOL ----
function setTool(t){
  tool=t;
  document.querySelectorAll('.tool-btn[id^="tool-"]').forEach(b=>b.classList.remove('active'));
  document.getElementById('tool-'+t)?.classList.add('active');
  canvas.className = t==='text'?'cursor-text':t==='eraser'?'cursor-eraser':'';
  if(t!=='text') commitText();
}

// ---- UNDO/REDO ----
function saveUndo(){
  undoStack.push(canvas.toDataURL());
  if(undoStack.length>40) undoStack.shift();
  redoStack=[];
}
function undo(){
  if(!undoStack.length) return;
  redoStack.push(canvas.toDataURL());
  const img=new Image();
  img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
  img.src=undoStack.pop();
}
function redo(){
  if(!redoStack.length) return;
  undoStack.push(canvas.toDataURL());
  const img=new Image();
  img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); };
  img.src=redoStack.pop();
}
function clearBoard(){
  if(!confirm('Clear the whiteboard?')) return;
  saveUndo();
  drawBackground();
}

// ---- DRAWING ----
let snapshot = null;

function getPos(e){
  const rect=canvas.getBoundingClientRect();
  const evt=e.touches?e.touches[0]:e;
  return { x:(evt.clientX-rect.left)*(canvas.width/rect.width),
           y:(evt.clientY-rect.top)*(canvas.height/rect.height) };
}

canvas.addEventListener('pointerdown', e=>{
  if(tool==='text'){ placeText(e); return; }
  const pos=getPos(e);
  saveUndo();
  drawing=true;
  startX=pos.x; startY=pos.y;
  snapshot=ctx.getImageData(0,0,canvas.width,canvas.height);

  if(tool==='pen'||tool==='marker'||tool==='eraser'){
    ctx.beginPath();
    ctx.moveTo(pos.x,pos.y);
  }
});

canvas.addEventListener('pointermove', e=>{
  if(!drawing) return;
  const pos=getPos(e);
  const sz = tool==='marker'?brushSize*3:brushSize;

  if(tool==='pen'||tool==='marker'){
    ctx.lineCap='round';
    ctx.lineJoin='round';
    ctx.lineWidth=sz;
    ctx.strokeStyle=colour;
    ctx.globalCompositeOperation='source-over';
    if(tool==='marker') ctx.globalAlpha=0.45; else ctx.globalAlpha=1;
    ctx.lineTo(pos.x,pos.y);
    ctx.stroke();
  } else if(tool==='eraser'){
    ctx.globalCompositeOperation='destination-out';
    ctx.globalAlpha=1;
    ctx.beginPath();
    ctx.arc(pos.x,pos.y,sz*1.5,0,Math.PI*2);
    ctx.fill();
    // Restore bg where erased
    ctx.globalCompositeOperation='destination-over';
    drawBackground();
    ctx.globalCompositeOperation='source-over';
  } else {
    // Shape preview
    ctx.putImageData(snapshot,0,0);
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    ctx.strokeStyle=colour;
    ctx.fillStyle=colour+'33';
    ctx.lineWidth=brushSize;
    ctx.lineCap='round';
    if(tool==='line'){
      ctx.beginPath(); ctx.moveTo(startX,startY); ctx.lineTo(pos.x,pos.y); ctx.stroke();
    } else if(tool==='rect'){
      ctx.beginPath();
      ctx.rect(startX,startY,pos.x-startX,pos.y-startY);
      ctx.fill(); ctx.stroke();
    } else if(tool==='circle'){
      const rx=(pos.x-startX)/2, ry=(pos.y-startY)/2;
      ctx.beginPath();
      ctx.ellipse(startX+rx,startY+ry,Math.abs(rx),Math.abs(ry),0,0,Math.PI*2);
      ctx.fill(); ctx.stroke();
    } else if(tool==='arrow'){
      drawArrow(startX,startY,pos.x,pos.y);
    }
  }
});

canvas.addEventListener('pointerup', e=>{
  if(!drawing) return;
  drawing=false;
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation='source-over';
  ctx.closePath?.();
});
canvas.addEventListener('pointerleave', ()=>{ if(drawing){ drawing=false; ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; }});

function drawArrow(x1,y1,x2,y2){
  const angle=Math.atan2(y2-y1,x2-x1);
  const len=20+brushSize;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2,y2);
  ctx.lineTo(x2-len*Math.cos(angle-Math.PI/6), y2-len*Math.sin(angle-Math.PI/6));
  ctx.lineTo(x2-len*Math.cos(angle+Math.PI/6), y2-len*Math.sin(angle+Math.PI/6));
  ctx.closePath();
  ctx.fillStyle=colour;
  ctx.fill();
}

// ---- TEXT ----
function placeText(e){
  commitText();
  const pos=getPos(e);
  textPos={x:pos.x,y:pos.y};
  const rect=canvas.getBoundingClientRect();
  const scaleX=rect.width/canvas.width;
  const scaleY=rect.height/canvas.height;
  textOverlay.style.display='block';
  textOverlay.style.left=(pos.x*scaleX+wrapper.getBoundingClientRect().left - wrapper.getBoundingClientRect().left)+'px';
  textOverlay.style.top=(pos.y*scaleY)+'px';
  textOverlay.style.fontSize=Math.max(14,brushSize*3)+'px';
  textOverlay.style.color=colour;
  textOverlay.value='';
  textOverlay.focus();
}
function commitText(){
  const val=textOverlay.value.trim();
  if(val){
    saveUndo();
    ctx.font=`bold ${Math.max(14,brushSize*3)}px Segoe UI, sans-serif`;
    ctx.fillStyle=colour;
    ctx.globalAlpha=1;
    val.split('\n').forEach((line,i)=>{
      ctx.fillText(line, textPos.x, textPos.y + i*Math.max(18,brushSize*3.6));
    });
  }
  textOverlay.style.display='none';
  textOverlay.value='';
}

// ---- SAVE ----
function saveImage(){
  const a=document.createElement('a');
  a.download='whiteboard.png';
  a.href=canvas.toDataURL('image/png');
  a.click();
}

// ---- FULLSCREEN ----
function toggleFullscreen(){
  if(!document.fullscreenElement) document.documentElement.requestFullscreen().then(()=>setTimeout(resizeCanvas,200));
  else document.exitFullscreen();
}
document.addEventListener('fullscreenchange',()=>setTimeout(resizeCanvas,200));

// ---- KEYBOARD SHORTCUTS ----
document.addEventListener('keydown',e=>{
  if(e.target===textOverlay) return;
  if(e.ctrlKey&&e.key==='z'){ undo(); return; }
  if(e.ctrlKey&&e.key==='y'){ redo(); return; }
  const map={p:'pen',m:'marker',e:'eraser',l:'line',r:'rect',c:'circle',a:'arrow',t:'text'};
  if(map[e.key.toLowerCase()]) setTool(map[e.key.toLowerCase()]);
  if(e.key==='F11'){ e.preventDefault(); toggleFullscreen(); }
});

// ---- INIT ----
window.addEventListener('resize',resizeCanvas);
buildSwatches();
resizeCanvas();
drawBackground();
saveUndo();
</script>
</body>
</html>
