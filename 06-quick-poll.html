<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quick Poll — Handy Teacher Tools</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Fraunces:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #fef9f0;
    --card: #ffffff;
    --navy: #1e2d5a;
    --accent: #6c63ff;
    --green: #06d6a0;
    --red: #ef233c;
    --yellow: #ffd60a;
    --text: #1e2d5a;
    --muted: #8892b0;
    --border: #e8e4f0;
    --shadow: 0 4px 24px rgba(108,99,255,0.1);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Nunito', sans-serif; min-height: 100vh; }

  nav { background: var(--navy); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; }
  nav a { color: rgba(255,255,255,0.6); text-decoration: none; font-weight: 700; font-size: 14px; }
  nav a:hover { color: white; }
  nav .tool-title { font-family: 'Fraunces', serif; font-size: 1.3rem; color: white; }

  main { max-width: 900px; margin: 0 auto; padding: 40px 20px 60px; }

  /* SETUP SCREEN */
  .screen { display: none; }
  .screen.active { display: block; }

  /* QUESTION BUILDER */
  .builder-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 32px;
    margin-bottom: 24px;
  }
  .builder-card h2 { font-family: 'Fraunces', serif; font-size: 1.5rem; color: var(--navy); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }

  .question-input {
    width: 100%;
    border: 2px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    margin-bottom: 20px;
    background: var(--bg);
  }
  .question-input:focus { border-color: var(--accent); }

  .poll-type-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .type-tab {
    padding: 9px 18px;
    border-radius: 100px;
    border: 2px solid var(--border);
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .type-tab:hover { border-color: var(--accent); color: var(--accent); }
  .type-tab.active { background: var(--accent); border-color: var(--accent); color: white; }

  /* OPTIONS */
  .options-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .option-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .option-letter {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 0.9rem;
    color: white;
    flex-shrink: 0;
  }
  .option-input {
    flex: 1;
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    background: var(--bg);
  }
  .option-input:focus { border-color: var(--accent); }
  .del-btn {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(239,35,60,0.1);
    color: var(--red);
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .del-btn:hover { background: rgba(239,35,60,0.2); }
  .add-option-btn {
    background: none;
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 10px;
    width: 100%;
    font-family: 'Nunito', sans-serif;
    font-size: 0.9rem;
    font-weight: 800;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .add-option-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* SETTINGS ROW */
  .settings-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }
  .setting-group { display: flex; align-items: center; gap: 8px; }
  .setting-group label { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
  .toggle {
    position: relative;
    width: 44px; height: 24px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-track {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 100px;
    transition: background 0.2s;
  }
  .toggle input:checked + .toggle-track { background: var(--accent); }
  .toggle-track::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 20px; height: 20px;
    background: white;
    border-radius: 50%;
    transition: left 0.2s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .toggle input:checked + .toggle-track::after { left: 22px; }

  .btn-launch {
    width: 100%;
    padding: 18px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.2rem;
    font-weight: 900;
    cursor: pointer;
    transition: all 0.2s;
    box-shadow: 0 4px 20px rgba(108,99,255,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
  }
  .btn-launch:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(108,99,255,0.4); }

  /* ── VOTING SCREEN ── */
  .poll-display {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    padding: 40px 32px;
  }

  .poll-question {
    font-family: 'Fraunces', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 900;
    color: var(--navy);
    text-align: center;
    margin-bottom: 36px;
    line-height: 1.3;
  }

  .vote-buttons {
    display: grid;
    gap: 14px;
    margin-bottom: 32px;
  }
  .vote-btn {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 24px;
    border-radius: 14px;
    border: 3px solid var(--border);
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05rem;
    font-weight: 800;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .vote-btn:hover { border-color: var(--accent); transform: translateX(4px); background: #f8f6ff; }
  .vote-btn.voted { border-color: currentColor; transform: translateX(6px); }
  .vote-letter {
    width: 38px; height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 0.95rem;
    color: white;
    flex-shrink: 0;
  }
  .vote-count {
    margin-left: auto;
    font-size: 1.3rem;
    font-weight: 900;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .vote-count.visible { opacity: 1; }

  /* RESULTS BAR */
  .results-bar {
    position: relative;
    margin-top: 6px;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
  }
  .results-bar-fill {
    height: 100%;
    border-radius: 3px;
    width: 0%;
    transition: width 0.4s ease;
  }

  /* POLL STATUS */
  .poll-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .total-votes { font-size: 1rem; font-weight: 800; color: var(--muted); }
  .total-votes span { color: var(--accent); font-size: 1.3rem; }

  .poll-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn-sm {
    padding: 10px 18px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: white;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.danger:hover { border-color: var(--red); color: var(--red); }
  .btn-sm.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .btn-sm.primary:hover { background: #5a52e8; }

  /* REVEAL OVERLAY */
  .reveal-badge {
    display: none;
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.4rem;
  }

  /* CONFETTI */
  .confetti-wrap { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1000; }
  .conf-piece {
    position: absolute;
    top: -10px;
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: confettiFall linear both;
  }
  @keyframes confettiFall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* PRESETS */
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .preset-btn {
    padding: 7px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: white;
    font-size: 0.8rem;
    font-weight: 800;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover { border-color: var(--accent); color: var(--accent); background: #f8f6ff; }

  footer { text-align: center; padding: 20px; font-size: 12px; color: var(--muted); font-weight: 600; }
  footer a { color: var(--muted); text-decoration: none; }

  @media (max-width: 500px) {
    .builder-card { padding: 20px; }
    .poll-display { padding: 24px 16px; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html">← All Tools</a>
  <span class="tool-title">📊 Quick Poll</span>
  <span style="font-size:12px;color:rgba(255,255,255,0.4)">handyteachertools.com</span>
</nav>

<main>

  <!-- SETUP SCREEN -->
  <div class="screen active" id="setupScreen">

    <div class="builder-card">
      <h2>📊 Build Your Poll</h2>

      <!-- PRESETS -->
      <div>
        <p style="font-size:0.82rem;color:var(--muted);font-weight:700;margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px">Quick Presets</p>
        <div class="presets">
          <button class="preset-btn" onclick="loadPreset('yesno')">👍 Yes / No</button>
          <button class="preset-btn" onclick="loadPreset('agree')">🤔 Agree / Disagree</button>
          <button class="preset-btn" onclick="loadPreset('abc')">🔤 A / B / C / D</button>
          <button class="preset-btn" onclick="loadPreset('rate')">⭐ Rate 1–5</button>
          <button class="preset-btn" onclick="loadPreset('tf')">✅ True / False</button>
          <button class="preset-btn" onclick="loadPreset('feeling')">😀 Feeling Check</button>
        </div>
      </div>

      <input class="question-input" id="questionInput" type="text" placeholder="Type your question here..." maxlength="200"/>

      <!-- OPTIONS LIST -->
      <div class="options-list" id="optionsList"></div>
      <button class="add-option-btn" onclick="addOption()">+ Add Option</button>

      <div class="settings-row">
        <div class="setting-group">
          <label for="showLive">Show live results</label>
          <label class="toggle">
            <input type="checkbox" id="showLive" checked/>
            <span class="toggle-track"></span>
          </label>
        </div>
        <div class="setting-group">
          <label for="showPercent">Show percentages</label>
          <label class="toggle">
            <input type="checkbox" id="showPercent" checked/>
            <span class="toggle-track"></span>
          </label>
        </div>
      </div>
    </div>

    <button class="btn-launch" onclick="launchPoll()">🚀 Launch Poll</button>

  </div>

  <!-- VOTING SCREEN -->
  <div class="screen" id="pollScreen">
    <div class="poll-display">
      <div class="poll-question" id="pollQuestion"></div>
      <div class="vote-buttons" id="voteButtons"></div>
      <div class="poll-status">
        <div class="total-votes">Total votes: <span id="totalVotes">0</span></div>
        <div class="poll-actions">
          <button class="btn-sm" onclick="resetVotes()">🔄 Reset Votes</button>
          <button class="btn-sm" onclick="revealResults()">👁️ Reveal Results</button>
          <button class="btn-sm primary" onclick="newPoll()">+ New Poll</button>
        </div>
      </div>
    </div>
  </div>

</main>

<div class="confetti-wrap" id="confettiWrap"></div>
<footer><a href="index.html">← Back to all tools</a> · handyteachertools.com</footer>

<script>
  const COLORS = ['#6c63ff','#06d6a0','#ef233c','#ffd60a','#ff6b35','#4ecdc4','#f72585','#3a86ff'];
  const LETTERS = ['A','B','C','D','E','F','G','H'];
  let options = [];
  let votes = [];
  let revealed = false;
  let showLive = true;
  let showPercent = true;

  const PRESETS = {
    yesno:   { q: 'Yes or No?',         opts: ['Yes 👍','No 👎'] },
    agree:   { q: 'Do you agree?',      opts: ['Strongly Agree','Agree','Disagree','Strongly Disagree'] },
    abc:     { q: 'What\'s the answer?', opts: ['A','B','C','D'] },
    rate:    { q: 'Rate your understanding (1–5)', opts: ['1 ⭐','2 ⭐⭐','3 ⭐⭐⭐','4 ⭐⭐⭐⭐','5 ⭐⭐⭐⭐⭐'] },
    tf:      { q: 'True or False?',     opts: ['True ✅','False ❌'] },
    feeling: { q: 'How are you feeling today?', opts: ['Great 😄','Good 🙂','Okay 😐','Tired 😴','Stressed 😬'] }
  };

  function loadPreset(key) {
    const p = PRESETS[key];
    document.getElementById('questionInput').value = p.q;
    renderOptionInputs(p.opts);
  }

  function renderOptionInputs(opts) {
    const list = document.getElementById('optionsList');
    list.innerHTML = '';
    opts.forEach((o, i) => addOption(o));
  }

  function addOption(val = '') {
    const list = document.getElementById('optionsList');
    const i = list.children.length;
    if (i >= 8) return;
    const row = document.createElement('div');
    row.className = 'option-row';
    row.innerHTML = `
      <div class="option-letter" style="background:${COLORS[i % COLORS.length]}">${LETTERS[i]}</div>
      <input class="option-input" type="text" placeholder="Option ${LETTERS[i]}..." value="${val}" maxlength="80"/>
      <button class="del-btn" onclick="removeOption(this)" title="Remove">×</button>
    `;
    list.appendChild(row);
  }

  function removeOption(btn) {
    const list = document.getElementById('optionsList');
    if (list.children.length <= 2) return;
    btn.closest('.option-row').remove();
    // Reindex
    [...list.children].forEach((row, i) => {
      row.querySelector('.option-letter').style.background = COLORS[i % COLORS.length];
      row.querySelector('.option-letter').textContent = LETTERS[i];
      row.querySelector('.option-input').placeholder = `Option ${LETTERS[i]}...`;
    });
  }

  function launchPoll() {
    const q = document.getElementById('questionInput').value.trim();
    if (!q) { document.getElementById('questionInput').focus(); return; }
    const inputs = document.querySelectorAll('.option-input');
    options = [...inputs].map(i => i.value.trim()).filter(v => v);
    if (options.length < 2) { alert('Please add at least 2 options.'); return; }

    votes = new Array(options.length).fill(0);
    revealed = false;
    showLive = document.getElementById('showLive').checked;
    showPercent = document.getElementById('showPercent').checked;

    document.getElementById('pollQuestion').textContent = q;
    renderVoteButtons();
    document.getElementById('setupScreen').classList.remove('active');
    document.getElementById('pollScreen').classList.add('active');
  }

  function renderVoteButtons() {
    const container = document.getElementById('voteButtons');
    const total = votes.reduce((a,b) => a+b, 0);
    container.style.gridTemplateColumns = options.length <= 4 ? '1fr 1fr' : '1fr';
    if (options.length <= 2) container.style.gridTemplateColumns = '1fr';

    container.innerHTML = '';
    options.forEach((opt, i) => {
      const pct = total > 0 ? Math.round((votes[i] / total) * 100) : 0;
      const btn = document.createElement('button');
      btn.className = 'vote-btn';
      btn.style.color = COLORS[i % COLORS.length];
      btn.innerHTML = `
        <span class="vote-letter" style="background:${COLORS[i % COLORS.length]}">${LETTERS[i]}</span>
        <span style="flex:1;color:var(--text)">${opt}</span>
        <span class="vote-count ${(showLive || revealed) ? 'visible' : ''}">
          ${showPercent && total > 0 ? pct + '%' : votes[i]}
        </span>
        <div style="position:absolute;bottom:0;left:0;right:0;height:4px;background:var(--border);border-radius:0 0 11px 11px;overflow:hidden">
          <div style="height:100%;width:${(showLive || revealed) ? pct : 0}%;background:${COLORS[i % COLORS.length]};border-radius:0 0 11px 11px;transition:width 0.4s ease"></div>
        </div>
      `;
      btn.style.position = 'relative';
      btn.style.overflow = 'hidden';
      btn.onclick = () => castVote(i);
      container.appendChild(btn);
    });
    document.getElementById('totalVotes').textContent = total;
  }

  function castVote(i) {
    votes[i]++;
    renderVoteButtons();
  }

  function resetVotes() {
    votes = new Array(options.length).fill(0);
    revealed = false;
    renderVoteButtons();
  }

  function revealResults() {
    revealed = true;
    renderVoteButtons();
    // Find winner
    const max = Math.max(...votes);
    if (max > 0) spawnConfetti();
  }

  function newPoll() {
    document.getElementById('pollScreen').classList.remove('active');
    document.getElementById('setupScreen').classList.add('active');
  }

  function spawnConfetti() {
    const wrap = document.getElementById('confettiWrap');
    wrap.innerHTML = '';
    for (let i = 0; i < 60; i++) {
      const p = document.createElement('div');
      p.className = 'conf-piece';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      wrap.appendChild(p);
    }
    setTimeout(() => wrap.innerHTML = '', 4000);
  }

  // Init with yes/no
  loadPreset('yesno');
</script>
</body>
</html>
