<!-- ============================================================
  COOKIE CONSENT BANNER
  Paste this block into EVERY HTML page, just before </body>
  It only shows once — stores consent in localStorage.
  Required for Google AdSense GDPR compliance.
============================================================ -->

<div id="cookieBanner" style="
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: #1a2e25;
  color: #f0f0e8;
  padding: 16px 24px;
  z-index: 9999;
  font-family: 'Nunito', sans-serif;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
  border-top: 3px solid #4caf50;
">
  <div style="max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
    <div style="flex:1;min-width:240px">
      <p style="font-size:0.88rem;font-weight:700;line-height:1.6;color:rgba(255,255,255,0.85)">
        🍪 We use advertising cookies (via Google AdSense) to keep this site free for teachers.
        Our tools themselves collect no data. See our
        <a href="cookies.html" style="color:#ffc107;font-weight:800;text-decoration:none">Cookie Policy</a>
        and
        <a href="privacy.html" style="color:#ffc107;font-weight:800;text-decoration:none">Privacy Policy</a>.
      </p>
    </div>
    <div style="display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap">
      <button onclick="acceptCookies()" style="
        padding: 10px 22px;
        background: #4caf50;
        color: white;
        border: none;
        border-radius: 8px;
        font-family: 'Nunito', sans-serif;
        font-size: 0.88rem;
        font-weight: 800;
        cursor: pointer;
        transition: opacity 0.2s;
      " onmouseover="this.style.opacity='0.85'" onmouseout="this.style.opacity='1'">
        ✅ Accept All
      </button>
      <button onclick="declineCookies()" style="
        padding: 10px 22px;
        background: transparent;
        color: rgba(255,255,255,0.7);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 8px;
        font-family: 'Nunito', sans-serif;
        font-size: 0.88rem;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s;
      " onmouseover="this.style.borderColor='rgba(255,255,255,0.7)';this.style.color='white'" onmouseout="this.style.borderColor='rgba(255,255,255,0.3)';this.style.color='rgba(255,255,255,0.7)'">
        Decline
      </button>
      <a href="cookies.html" style="
        padding: 10px 16px;
        color: rgba(255,255,255,0.5);
        font-family: 'Nunito', sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none;
        display: flex;
        align-items: center;
      ">More info</a>
    </div>
  </div>
</div>

<script>
(function() {
  var consent = localStorage.getItem('htt_cookie_consent');
  if (!consent) {
    document.getElementById('cookieBanner').style.display = 'block';
  }
})();

function acceptCookies() {
  localStorage.setItem('htt_cookie_consent', 'accepted');
  document.getElementById('cookieBanner').style.display = 'none';
  // If you have AdSense consent mode, signal consent here
}

function declineCookies() {
  localStorage.setItem('htt_cookie_consent', 'declined');
  document.getElementById('cookieBanner').style.display = 'none';
}
</script>
