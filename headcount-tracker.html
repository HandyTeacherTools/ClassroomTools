<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Daily classroom head count tracker for the Ontario student attendance confirmation policy. Works offline; data stays in your browser."><meta name="theme-color" content="#0f5c63"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Head Count">
<title>Daily Head Count Tracker</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#18222b;--mu:#566471;--bd:#cfd8d6;--ac:#0f5c63;--acx:#fff;--ok:#17703f;--okb:#dff3e7;--bad:#b3261e;--badb:#fde6e3;--na:#e9eceb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171a;--card:#19242a;--tx:#e8eef0;--mu:#97a7ae;--bd:#2c3b43;--ac:#4cc3cc;--acx:#06292c;--ok:#6ad79a;--okb:#16372a;--bad:#ff8f86;--badb:#41201d;--na:#1f2b31}}
:root[data-theme="dark"]{--bg:#10171a;--card:#19242a;--tx:#e8eef0;--mu:#97a7ae;--bd:#2c3b43;--ac:#4cc3cc;--acx:#06292c;--ok:#6ad79a;--okb:#16372a;--bad:#ff8f86;--badb:#41201d;--na:#1f2b31}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100%}
main{max-width:760px;margin:0 auto;padding:12px}
h1{font-size:1.25rem;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.hdr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{font-size:.8rem;color:var(--mu);display:block}
input,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;min-height:44px}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1}.tabs .on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}.nav strong{flex:1;text-align:center;font-size:1.1rem}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.row:first-of-type{border-top:0}
.row .nm{font-weight:600}.row small{color:var(--mu)}
.ctl{display:flex;gap:6px;align-items:center}.ctl input{width:64px;text-align:center;font-size:1.1rem;font-weight:600}
.ok{background:var(--okb)}.bad{background:var(--badb)}
.tag{font-size:.8rem;font-weight:600}.tag.ok{color:var(--ok);background:none}.tag.bad{color:var(--bad);background:none}
.alert{border:2px solid var(--bad);background:var(--badb);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.alert ol{margin:6px 0 0 18px;padding:0}
.prog{height:8px;background:var(--na);border-radius:4px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--ok)}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.8rem;min-width:900px}
th,td{border:1px solid var(--bd);padding:4px;text-align:center}th{background:var(--na);font-weight:600}
td.d{cursor:pointer;font-weight:600;text-align:left;white-space:nowrap}td.nsc{background:var(--na);color:var(--mu)}
td.n{text-align:left;min-width:120px}
.foot{display:flex;gap:8px;flex-wrap:wrap}.foot button{flex:1}
.ph{display:none}
@media print{@page{size:landscape;margin:10mm}body{background:#fff;color:#000}.noprint,.tabs,.foot,#day{display:none!important}#month{display:block!important}.ph{display:block;margin-bottom:6px}.wrap{overflow:visible}table{min-width:0;font-size:9px}main{max-width:none;padding:0}.card{border:0;padding:0}.ok{background:#e4f5ea!important}.bad{background:#fbd9d5!important}}
</style></head><body><main>
<h1 class="noprint">Daily Head Count Tracker</h1>
<div class="card noprint"><div class="hdr">
<div><label for="room">Homeroom</label><input id="room"></div>
<div><label for="grade">Grade / class</label><input id="grade"></div>
<div><label for="enrol">Students on class list</label><input id="enrol" inputmode="numeric"></div></div></div>
<div class="tabs noprint"><button id="tDay" class="on">Today</button><button id="tMon">November grid</button></div>
<section id="day"></section>
<section id="month" hidden><div class="ph" id="ph"></div><div class="card"><div class="wrap" id="grid"></div></div></section>
<div class="foot noprint"><button id="pr" class="p">Print or save as PDF</button><button id="rs">Clear all data</button></div>
<p class="noprint" style="color:var(--mu);font-size:.85rem">Counts and notes are saved only in this browser on this device. Use student names nowhere; record numbers only. Print at month end for your office.</p>
</main>
<script>
var KEY="hc-nov-2026",CP=[["arr","Arrival / Block 1"],["amr","AM recess return"],["amn","AM nutrition break return"],["b2","Block 2"],["pmr","PM recess return"],["pmn","PM nutrition break return"],["b3","Block 3"],["pe","Phys. Ed. / DPA"],["mu","Music / Planning"],["o1","Other (assembly, library, drill, rotary…)"],["o2","Other (assembly, library, drill, rotary…)"],["dis","End-of-day dismissal"]];
var NS={20:"PA Day"},DAYS=[],S={room:"",grade:"",enrol:"",days:{},sel:2},view="day";
for(var d=2;d<=30;d++){var w=new Date(2026,10,d).getDay();if(w>0&&w<6)DAYS.push(d)}
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
(function(){var t=new Date();if(t.getFullYear()==2026&&t.getMonth()==10&&DAYS.indexOf(t.getDate())>-1)S.sel=t.getDate()})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function D(d){return S.days[d]||(S.days[d]={present:"",c:{},note:""})}
function exp(d){var p=D(d).present;if(p!=="")return +p;return S.enrol!==""?+S.enrol:null}
function st(d,id){var c=D(d).c[id],e=exp(d);if(!c)return"p";if(e==null)return"r";return c.n===e?"ok":"bad"}
function now(){return new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function renderDay(){
var d=S.sel,dy=D(d),e=exp(d),i=DAYS.indexOf(d),h="";
h+='<div class="nav"><button id="pv" aria-label="Previous day"'+(i<1?" disabled":"")+'>‹</button><strong>Nov '+d+', 2026 '+["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(2026,10,d).getDay()]+'</strong><button id="nx" aria-label="Next day"'+(i>=DAYS.length-1?" disabled":"")+'>›</button></div>';
if(NS[d]){$("day").innerHTML=h+'<div class="card"><strong>'+NS[d]+'</strong> — no school for students. Nothing to record.</div>';nav();return}
var bad=CP.filter(function(c){return st(d,c[0])=="bad"});
var done=CP.filter(function(c){return dy.c[c[0]]}).length;
h+='<div class="card"><label for="pres">Students present today (from attendance)</label><input id="pres" inputmode="numeric" value="'+esc(dy.present)+'" placeholder="'+(S.enrol!==""?S.enrol:"enter number")+'"><div class="prog" aria-hidden="true"><i style="width:'+Math.round(done/CP.length*100)+'%"></i></div><small style="color:var(--mu)">'+done+' of '+CP.length+' checkpoints recorded. Skip any that did not happen today.</small></div>';
if(bad.length)h+='<div class="alert" role="alert"><strong>Count does not match ('+bad.map(function(c){return c[1]}).join("; ")+')</strong><ol><li>Recount right away.</li><li>Check attendance and sign-in/sign-out.</li><li>Call the office if not resolved quickly.</li><li>Follow school safety procedures if a student’s whereabouts remain unknown.</li></ol></div>';
h+='<div class="card">';
CP.forEach(function(c){var s=st(d,c[0]),v=dy.c[c[0]];
h+='<div class="row"><div><div class="nm">'+c[1]+'</div><small>'+(v?(v.t+(s=="ok"?"":"")):"Not yet recorded")+'</small> '+(s=="ok"?'<span class="tag ok">✓ Matches</span>':s=="bad"?'<span class="tag bad">⚠ Expected '+e+'</span>':"")+'</div><div class="ctl">'
+'<input data-id="'+c[0]+'" inputmode="numeric" aria-label="'+c[1]+' count" class="'+(s=="ok"?"ok":s=="bad"?"bad":"")+'" value="'+(v?v.n:"")+'">'
+'<button class="p" data-m="'+c[0]+'" title="Record count equal to students present"'+(e==null?" disabled":"")+'>All here</button>'
+(v?'<button data-x="'+c[0]+'" aria-label="Clear">×</button>':"")+'</div></div>'});
h+='</div><div class="card"><label for="note">Notes (late arrival, early pickup, etc.)</label><textarea id="note" rows="2">'+esc(dy.note)+'</textarea></div>';
$("day").innerHTML=h;nav()}
function nav(){
var p=$("pv"),n=$("nx");
if(p)p.onclick=function(){S.sel=DAYS[DAYS.indexOf(S.sel)-1];save();renderDay()};
if(n)n.onclick=function(){S.sel=DAYS[DAYS.indexOf(S.sel)+1];save();renderDay()};
var pr=$("pres");if(pr)pr.onchange=function(){D(S.sel).present=this.value.replace(/\D/g,"");save();renderDay()};
var nt=$("note");if(nt)nt.onchange=function(){D(S.sel).note=this.value;save()};
document.querySelectorAll("[data-id]").forEach(function(el){el.onchange=function(){var v=this.value.replace(/\D/g,"");if(v==="")delete D(S.sel).c[this.dataset.id];else D(S.sel).c[this.dataset.id]={n:+v,t:now()};save();renderDay()}});
document.querySelectorAll("[data-m]").forEach(function(el){el.onclick=function(){D(S.sel).c[this.dataset.m]={n:exp(S.sel),t:now()};save();renderDay()}});
document.querySelectorAll("[data-x]").forEach(function(el){el.onclick=function(){delete D(S.sel).c[this.dataset.x];save();renderDay()}})}
function renderGrid(){
var h='<table><thead><tr><th>Day</th><th>Present</th>'+CP.map(function(c){return"<th>"+c[1].replace(/ \(.*/,"")+"</th>"}).join("")+'<th>Notes</th></tr></thead><tbody>';
DAYS.forEach(function(d){var dy=D(d);
if(NS[d]){h+='<tr><td class="d nsc">Nov '+d+'</td><td class="nsc" colspan="'+(CP.length+2)+'">'+NS[d]+' (no school for students)</td></tr>';return}
h+='<tr><td class="d" data-g="'+d+'">Nov '+d+'</td><td>'+(exp(d)==null?"":exp(d))+'</td>';
CP.forEach(function(c){var s=st(d,c[0]),v=dy.c[c[0]];h+='<td class="'+(s=="ok"?"ok":s=="bad"?"bad":"")+'">'+(v?v.n:"")+'</td>'});
h+='<td class="n">'+esc(dy.note)+'</td></tr>'});
$("grid").innerHTML=h+'</tbody></table>';
$("ph").innerHTML='<strong>Monthly Classroom Headcount Verification Tracker — November 2026</strong><br>Homeroom: '+esc(S.room)+' &nbsp; Grade/Class: '+esc(S.grade);
document.querySelectorAll("[data-g]").forEach(function(el){el.onclick=function(){S.sel=+this.dataset.g;save();show("day")}})}
function show(v){view=v;$("day").hidden=v!="day";$("month").hidden=v!="month";$("tDay").className=v=="day"?"on":"";$("tMon").className=v=="month"?"on":"";if(v=="day")renderDay();else renderGrid()}
["room","grade","enrol"].forEach(function(k){var el=$(k);el.value=S[k];el.onchange=function(){S[k]=k=="enrol"?this.value.replace(/\D/g,""):this.value;save();show(view)}});
$("tDay").onclick=function(){show("day")};$("tMon").onclick=function(){show("month")};
$("pr").onclick=function(){show("month");window.print()};
$("rs").onclick=function(){if(confirm("Clear every count and note for November? This cannot be undone.")){S.days={};save();show(view)}};
show("day");
</script></body></html>
